plugins {
    id 'java'
    id 'application'
}

group = 'eu.amadeos'
// --8<-- [start:version]
// CI computes the version from the Conventional Commits since the last release tag and passes it as
// -PappVersion (datazuul/amadeos-ci scripts/next-version.sh); a build without it is a local development build.
version = findProperty('appVersion') ?: '0.0.0-dev.0'
// Debian sorts 1.1.0~dev.57 before 1.1.0 (with - it would sort after it).
def debVersion = version.toString().replace('-', '~')
// --8<-- [end:version]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'eu.amadeos.apps.news.bootstrap.AmadeNewsApplication'
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    // Theme, Motif look, start-up and XDG helpers shared by all amadeOS applications.
    // With ../amade-commons checked out, settings.gradle builds that checkout instead (composite build).
    implementation 'com.github.datazuul:amade-commons:v1.0.0'
    runtimeOnly 'ch.qos.logback:logback-classic:1.5.18'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    // Tests compare English texts, whatever the language of the build machine.
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
}

jar {
    archiveBaseName = 'amade-news'
    manifest {
        attributes(
            'Main-Class': 'eu.amadeos.apps.news.bootstrap.AmadeNewsApplication',
            'Implementation-Title': 'amade-news',
            'Implementation-Version': project.version
        )
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    // Signed dependency jars would otherwise invalidate the fat jar.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('deb') {
    dependsOn jar
    description = 'Builds a standard Debian (.deb) package for amade-news'
    group = 'distribution'

    doLast {
        def buildDirFile = layout.buildDirectory.get().asFile
        def stagingDir = new File(buildDirFile, 'deb-staging')
        delete(stagingDir)

        def optDir = new File(stagingDir, 'opt/amade-news')
        def binDir = new File(stagingDir, 'usr/bin')
        def appDir = new File(stagingDir, 'usr/share/applications')
        def iconDir = new File(stagingDir, 'usr/share/icons/hicolor/48x48/apps')
        def docDir = new File(stagingDir, 'usr/share/doc/amade-news')
        def debianDir = new File(stagingDir, 'DEBIAN')
        def distDir = new File(buildDirFile, 'distributions')
        [optDir, binDir, appDir, iconDir, docDir, debianDir, distDir]*.mkdirs()

        copy {
            from jar.archiveFile
            into optDir
            rename { 'amade-news.jar' }
        }

        def launcher = new File(binDir, 'amade-news')
        launcher.text = """#!/bin/sh
exec /usr/bin/java -jar /opt/amade-news/amade-news.jar "\$@"
"""
        launcher.setExecutable(true, false)

        copy {
            from 'packaging/amade-news.desktop'
            into appDir
        }
        // AppStream metadata: name, description and screenshot for amadeOS Software (and a repository's
        // appstream-generator).
        copy {
            from 'packaging/eu.amadeos.apps.news.metainfo.xml'
            into new File(stagingDir, "usr/share/metainfo")
        }
        copy {
            from 'src/main/resources/icons/amade-news.png'
            into iconDir
        }
        copy {
            from 'LICENSE'
            into docDir
            rename { 'copyright' }
        }

        new File(debianDir, 'control').text = """Package: amade-news
Version: ${debVersion}
Section: net
Priority: optional
Architecture: all
Depends: openjdk-25-jre | java-runtime (>= 25)
Maintainer: amadeOS Project <developers@datazuul.com>
Description: News and feed reader for amadeOS
 Follows news sites, blogs and podcasts through their RSS and Atom feeds:
 folders, unread and starred articles, read later, search, and OPML import
 and export. Europe's News offers the public broadcasters and news
 agencies of European countries to subscribe to with one click. Part of
 the amadeOS desktop.
"""

        def debFile = new File(distDir, "amade-news_${debVersion}_all.deb")
        def process = new ProcessBuilder('dpkg-deb', '--root-owner-group', '--build',
                stagingDir.absolutePath, debFile.absolutePath)
                .redirectErrorStream(true)
                .start()
        process.inputStream.eachLine { println it }
        if (process.waitFor() != 0) {
            throw new GradleException('dpkg-deb failed')
        }
        println "[deb] Created ${debFile.absolutePath}"
    }
}

tasks.register('installToAmadeOs') {
    dependsOn 'deb'
    description = 'Builds and drops the .deb package into ../amadeos/config/packages.chroot/'
    group = 'distribution'

    doLast {
        def targetDir = file('../amadeos/config/packages.chroot')
        targetDir.mkdirs()
        def debFile = new File(layout.buildDirectory.get().asFile, "distributions/amade-news_${debVersion}_all.deb")
        copy {
            from debFile
            into targetDir
        }
        println "[installToAmadeOs] Copied ${debFile.name} to ${targetDir.absolutePath}"
    }
}

// The pictures of the README and the AppStream metadata, from the real windows on a test scene with made-up
// feeds served from memory: xvfb-run ./gradlew screenshots
tasks.register('screenshots', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'eu.amadeos.apps.news.Screenshots'
    args 'docs/screenshots'
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'GB'
}
